name: Online Watch

on:
  schedule:
    # every 30 minutes (GitHub often starts scheduled runs a few minutes late)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HYPIXEL_KEY: ${{ secrets.HYPIXEL_KEY }}
          PLAYER: ${{ vars.PLAYER }}
        run: python3 watch.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "online-watch"
            git config user.email "online-watch@users.noreply.github.com"
            git add state.json
            git commit -m "state"
            git push
          fi
