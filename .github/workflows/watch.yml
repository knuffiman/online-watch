name: Online Watch

on:
  schedule:
    # every 5 minutes, the shortest GitHub allows (scheduled runs often start a few minutes late)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      overview:
        description: "Send an overview of all accounts"
        type: boolean
        default: true
      test_ping:
        description: "Only send test pings: a player, several (comma) or all"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HYPIXEL_KEY: ${{ secrets.HYPIXEL_KEY }}
          PLAYERS: ${{ vars.PLAYERS }}
          OVERVIEW: ${{ inputs.overview }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS }}
          TEST_PING: ${{ inputs.test_ping }}
        run: python3 watch.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json sessions.csv)" ]; then
            git config user.name "online-watch"
            git config user.email "online-watch@users.noreply.github.com"
            git add $(ls state.json sessions.csv 2>/dev/null)
            git commit -m "state"
            git push
          fi
