name: Online Watch

# GitHub drops most scheduled runs (yesterday: one run in 13 hours instead of every 5 minutes).
# So a run keeps checking by itself every minute for almost 6 hours and then starts the next one.
# The hourly schedule only restarts that chain if it ever breaks.

on:
  schedule:
    - cron: "17 * * * *"
  # "Run workflow" (re)starts the watch; it waits until a watching run has ended
  workflow_dispatch:
    inputs:
      # kept only so that runs started by older code still start (they send these); ignored
      loop:
        description: "(ignored)"
        type: boolean
        default: true
      overview:
        description: "(ignored)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # one watching run at a time; the next one waits
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HYPIXEL_KEY: ${{ secrets.HYPIXEL_KEY }}
          # hidden channel with the join codes of the Online Watch mod (RATTER alarm)
          HEARTBEAT_WEBHOOK: ${{ secrets.HEARTBEAT_WEBHOOK }}
          PLAYERS: ${{ vars.PLAYERS }}
          # pinged only with a RATTER alarm
          DISCORD_IDS: ${{ vars.DISCORD_IDS }}
          GITHUB_TOKEN: ${{ github.token }}
          # RATTER alarm: pings after the alarm card; seconds to wait for the mod's join code
          RAT_PINGS: 3
          HB_WAIT: 0
          # seconds between two Hypixel rounds, and between two reads of the mod codes (Discord)
          EVERY: 10
          FAST: 1
          # pinged (via DISCORD_IDS) when Hypixel sends errors or nothing for 3 rounds in a row
          ALERT_USER: Knuffiman
        run: python3 -u watch.py
