name: Online Watch

# GitHub drops most scheduled runs (yesterday: one run in 13 hours instead of every 5 minutes).
# So a run keeps checking by itself every minute for almost 6 hours and then starts the next one.
# The hourly schedule only restarts that chain if it ever breaks.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      overview:
        description: "Send an overview of all accounts"
        type: boolean
        default: true
      test_ping:
        description: "Only send test pings: a player, several (comma) or all"
        type: string
        default: ""
      loop:
        description: "Keep watching (started by the watch itself, leave off)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # one watching run at a time (the next one waits); manual overviews and test pings never wait
  group: ${{ (github.event_name == 'schedule' || inputs.loop) && 'watch' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Install networth calculator
        # SkyHelper-Networth, exact version from package-lock.json; the bot runs without it if this fails
        run: npm ci --ignore-scripts --no-audit --no-fund || true
      - name: Check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HYPIXEL_KEY: ${{ secrets.HYPIXEL_KEY }}
          PLAYERS: ${{ vars.PLAYERS }}
          DISCORD_IDS: ${{ vars.DISCORD_IDS }}
          OVERVIEW: ${{ inputs.overview }}
          TEST_PING: ${{ inputs.test_ping }}
          # manual runs only report; the watching run is the only one that saves the state
          LOOP: ${{ github.event_name == 'schedule' || inputs.loop }}
          GITHUB_TOKEN: ${{ github.token }}
          # test: overview card of all players every N minutes; 0 = off
          OVERVIEW_EVERY: 0
          # RAT alarm: networth (without the shared bank) of the same profile drops at least
          # RAT_DROP_PERCENT % and RAT_MIN_COINS within RAT_MINUTES -> alarm card + RAT_PINGS pings
          RAT_DROP_PERCENT: 25
          RAT_MIN_COINS: 100000000
          RAT_MINUTES: 30
          RAT_PINGS: 3
        run: python3 -u watch.py
