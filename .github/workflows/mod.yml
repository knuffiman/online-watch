name: Build mod

# Builds the Online Watch mod (mod/): ONE jar for all watched accounts, with the hidden-channel
# webhook and, per account, its message id and key built in. Whoever plays on any of these
# accounts with it sends that account's join and leave codes. The jar goes ONLY into the hidden
# Discord channel and is never uploaded to GitHub: the repo is public and the jar holds the keys.

on:
  workflow_dispatch:
    inputs:
      players:
        description: "Accounts the mod is for, comma separated (empty: the watched players)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Code messages and mod settings
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEARTBEAT_WEBHOOK: ${{ secrets.HEARTBEAT_WEBHOOK }}
          PLAYERS: ${{ inputs.players || vars.PLAYERS }}
        run: python3 heartbeat.py setup
      - name: Save heartbeat.json
        run: |
          if [ -n "$(git status --porcelain heartbeat.json)" ]; then
            git config user.name "online-watch"
            git config user.email "online-watch@users.noreply.github.com"
            git add heartbeat.json
            git commit -m "heartbeat: code messages for the mod"
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - name: Build
        working-directory: mod
        run: ./gradlew build --no-daemon -q
      - name: Send the jar into the hidden channel
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEARTBEAT_WEBHOOK: ${{ secrets.HEARTBEAT_WEBHOOK }}
          PLAYERS: ${{ inputs.players || vars.PLAYERS }}
        run: |
          python3 heartbeat.py upload mod/build/libs/onlinewatch-1.1.0.jar
          rm -f mod/src/main/resources/onlinewatch.properties
