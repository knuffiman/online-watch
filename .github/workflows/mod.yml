name: Build mod

# Builds the Online Watch mod (mod/) for one player with the hidden-channel webhook, its message
# id and the player's key built in, and sends the jar ONLY into the hidden Discord channel.
# The jar is never uploaded to GitHub: the repo is public and the jar holds the key.

on:
  workflow_dispatch:
    inputs:
      player:
        description: "Minecraft name the mod is for"
        type: string
        default: "Knuffiman"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Code message and mod settings
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEARTBEAT_WEBHOOK: ${{ secrets.HEARTBEAT_WEBHOOK }}
          PLAYER: ${{ inputs.player }}
        run: python3 heartbeat.py setup "$PLAYER"
      - name: Save heartbeat.json
        run: |
          if [ -n "$(git status --porcelain heartbeat.json)" ]; then
            git config user.name "online-watch"
            git config user.email "online-watch@users.noreply.github.com"
            git add heartbeat.json
            git commit -m "heartbeat: code message for ${{ inputs.player }}"
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - name: Build
        working-directory: mod
        run: ./gradlew build --no-daemon -q
      - name: Send the jar into the hidden channel
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEARTBEAT_WEBHOOK: ${{ secrets.HEARTBEAT_WEBHOOK }}
          PLAYER: ${{ inputs.player }}
        run: |
          python3 heartbeat.py upload "$PLAYER" mod/build/libs/onlinewatch-1.0.0.jar
          rm -f mod/src/main/resources/onlinewatch.properties
